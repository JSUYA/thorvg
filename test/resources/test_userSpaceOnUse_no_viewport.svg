<!--
  Test: userSpaceOnUse gradients in SVG without viewport info.
  Covers per SVG 1.1 section 13.2.2 (linearGradient) and 13.2.3 (radialGradient):
    - gradientUnits="userSpaceOnUse" percentage and absolute coordinate resolution
    - Gradient inheritance via xlink:href
    - Interaction with transforms, groups, clip-paths, masks, and use elements
    - objectBoundingBox gradients coexisting with userSpaceOnUse (must not regress)
-->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <!-- 1. Linear gradient with percentage values only -->
    <linearGradient id="lgPct" x1="0%" y1="0%" x2="50%" y2="100%" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="yellow"/>
      <stop offset="50%" stop-color="blue"/>
      <stop offset="100%" stop-color="red"/>
    </linearGradient>

    <!-- 2. Linear gradient with absolute values only -->
    <linearGradient id="lgAbs" x1="0" y1="0" x2="200" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="green"/>
      <stop offset="100%" stop-color="purple"/>
    </linearGradient>

    <!-- 3. Linear gradient with mixed percentage/absolute -->
    <linearGradient id="lgMix" x1="0" y1="0" x2="100%" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="orange"/>
      <stop offset="100%" stop-color="cyan"/>
    </linearGradient>

    <!-- 4. Radial gradient with percentage values -->
    <radialGradient id="rgPct" cx="50%" cy="50%" r="50%" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="white"/>
      <stop offset="100%" stop-color="darkblue"/>
    </radialGradient>

    <!-- 5. Radial gradient with absolute + focal point -->
    <radialGradient id="rgAbs" cx="200" cy="50" r="80" fx="180" fy="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="yellow"/>
      <stop offset="100%" stop-color="red"/>
    </radialGradient>

    <!-- 6. Gradient inheritance: child inherits from userSpaceOnUse parent -->
    <linearGradient id="lgBase" x1="0%" y1="0%" x2="100%" y2="100%" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="lime"/>
      <stop offset="100%" stop-color="magenta"/>
    </linearGradient>
    <linearGradient id="lgChild" xlink:href="#lgBase"/>

    <!-- 7. userSpaceOnUse gradient with gradientTransform -->
    <linearGradient id="lgXform" x1="0%" y1="0%" x2="100%" y2="0%"
                    gradientUnits="userSpaceOnUse" gradientTransform="rotate(30, 200, 50)">
      <stop offset="0%" stop-color="salmon"/>
      <stop offset="100%" stop-color="teal"/>
    </linearGradient>

    <!-- 8. Stroke gradient -->
    <linearGradient id="lgStroke" x1="0%" y1="0%" x2="100%" y2="0%" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="red"/>
      <stop offset="100%" stop-color="blue"/>
    </linearGradient>

    <!-- 9. objectBoundingBox gradient (must remain unaffected by the fix) -->
    <linearGradient id="lgOBB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="red"/>
      <stop offset="100%" stop-color="green"/>
    </linearGradient>

    <!-- 10. Radial gradient with percentage focal point (fr) -->
    <radialGradient id="rgFr" cx="50%" cy="50%" r="40%" fx="30%" fy="30%" fr="5%"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="gold"/>
      <stop offset="100%" stop-color="darkgreen"/>
    </radialGradient>

    <!-- 11. Clip path for clip+gradient interaction test -->
    <clipPath id="clipCircle">
      <circle cx="200" cy="100" r="90"/>
    </clipPath>

    <!-- 12. Mask for mask+gradient interaction test -->
    <mask id="maskRect">
      <rect x="0" y="0" width="400" height="100" fill="white"/>
    </mask>

    <!-- 13. Symbol for use element test -->
    <symbol id="symGrad" viewBox="0 0 200 50">
      <rect width="200" height="50" fill="url(#lgPct)"/>
    </symbol>

    <!-- 14. Gradient with spread: repeat -->
    <linearGradient id="lgRepeat" x1="0%" y1="0%" x2="25%" y2="0%"
                    gradientUnits="userSpaceOnUse" spreadMethod="repeat">
      <stop offset="0%" stop-color="navy"/>
      <stop offset="100%" stop-color="gold"/>
    </linearGradient>

    <!-- 15. Gradient with spread: reflect -->
    <radialGradient id="rgReflect" cx="50%" cy="50%" r="20%"
                    gradientUnits="userSpaceOnUse" spreadMethod="reflect">
      <stop offset="0%" stop-color="white"/>
      <stop offset="100%" stop-color="crimson"/>
    </radialGradient>
  </defs>

  <!-- Row 1: Basic percentage, absolute, and mixed linear gradients -->
  <ellipse cx="100" cy="50" rx="100" ry="50" fill="url(#lgPct)"/>
  <rect x="210" y="0" width="190" height="100" fill="url(#lgAbs)"/>

  <!-- Row 2: Mixed + radial percentage -->
  <rect x="0" y="110" width="200" height="60" fill="url(#lgMix)"/>
  <circle cx="310" cy="140" r="50" fill="url(#rgPct)"/>

  <!-- Row 3: Absolute radial + inherited gradient -->
  <circle cx="60" cy="240" r="40" fill="url(#rgAbs)"/>
  <rect x="120" y="200" width="280" height="80" fill="url(#lgChild)"/>

  <!-- Row 4: gradientTransform + stroke gradient -->
  <rect x="0" y="290" width="200" height="60" fill="url(#lgXform)"/>
  <rect x="210" y="290" width="190" height="60" fill="none" stroke="url(#lgStroke)" stroke-width="6"/>

  <!-- Row 5: objectBoundingBox (must not regress) + focal-radius radial -->
  <rect x="0" y="360" width="200" height="60" fill="url(#lgOBB)"/>
  <ellipse cx="310" cy="390" rx="90" ry="30" fill="url(#rgFr)"/>

  <!-- Row 6: Clip path + gradient interaction -->
  <g clip-path="url(#clipCircle)">
    <rect x="0" y="430" width="400" height="100" fill="url(#lgPct)"/>
  </g>

  <!-- Row 7: Mask + gradient interaction -->
  <g mask="url(#maskRect)" transform="translate(0, 540)">
    <rect x="0" y="0" width="400" height="100" fill="url(#lgMix)"/>
  </g>

  <!-- Row 8: Nested group with transform + userSpaceOnUse gradient -->
  <g transform="translate(0, 650)">
    <g transform="scale(0.8)">
      <rect x="0" y="0" width="500" height="60" fill="url(#lgPct)"/>
    </g>
  </g>

  <!-- Row 9: use element referencing symbol with gradient -->
  <use xlink:href="#symGrad" x="0" y="720" width="400" height="50"/>

  <!-- Row 10: Spread repeat + reflect -->
  <rect x="0" y="780" width="400" height="40" fill="url(#lgRepeat)"/>
  <rect x="0" y="830" width="400" height="40" fill="url(#rgReflect)"/>

  <!-- Row 11: Multiple shapes sharing same gradient (position test) -->
  <rect x="0" y="880" width="130" height="40" fill="url(#lgPct)"/>
  <rect x="135" y="880" width="130" height="40" fill="url(#lgPct)"/>
  <rect x="270" y="880" width="130" height="40" fill="url(#lgPct)"/>
</svg>
